<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30秒射擊對決</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .target-anim {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden">

    <!-- 主容器 -->
    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 flex flex-col gap-5 relative">
        
        <!-- 標題與倒數計時 -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    🎯 30秒射擊對決
                </h1>
                <p class="text-xs text-slate-400">對手 AI：每 5 秒射擊 3 次</p>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-400">剩餘時間</div>
                <div id="timer" class="text-3xl font-extrabold text-amber-400">30.0s</div>
            </div>
        </div>

        <!-- 比分與進度條比較 -->
        <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
            <!-- 玩家進度條 -->
            <div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="font-semibold text-cyan-400">🧑 玩家得分: <span id="player-score">0</span></span>
                    <span id="player-percent" class="text-xs text-slate-400">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3.5 overflow-hidden">
                    <div id="player-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-100 rounded-full"></div>
                </div>
            </div>

            <!-- AI 進度條 -->
            <div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="font-semibold text-rose-400">🤖 AI 對手得分: <span id="ai-score">0</span></span>
                    <span id="ai-percent" class="text-xs text-slate-400">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3.5 overflow-hidden">
                    <div id="ai-bar" class="bg-gradient-to-r from-rose-500 to-red-600 h-full w-0 transition-all duration-100 rounded-full"></div>
                </div>
            </div>

            <!-- 實時差距 -->
            <div class="text-center text-xs font-bold pt-1 text-slate-300" id="diff-status">
                準備開始...
            </div>
        </div>

        <!-- 射擊靶場 Canvas Area -->
        <div class="relative w-full h-72 bg-slate-950 rounded-xl overflow-hidden border-2 border-slate-700 cursor-crosshair flex items-center justify-center" id="game-area">
            
            <canvas id="canvas" class="absolute inset-0 w-full h-full"></canvas>

            <!-- 開始/等待提示遮罩 -->
            <div id="start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
                <h2 class="text-2xl font-bold mb-2">準備好精準射擊了嗎？</h2>
                <p class="text-slate-400 text-sm mb-6">點擊出現在畫面中的靶心獲得分數！<br>AI 每 5 秒會精準射擊 3 次。</p>
                <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-lg rounded-xl shadow-lg transform active:scale-95 transition-all">
                    🎯 開始對決
                </button>
            </div>

            <!-- 結算畫面 -->
            <div id="result-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div id="result-icon" class="text-5xl mb-2">🏆</div>
                <h2 id="result-title" class="text-3xl font-black text-amber-400 mb-2">挑戰結束！</h2>
                <p id="result-detail" class="text-slate-300 text-base mb-6">玩家 0 分 vs AI 0 分</p>
                <div id="result-diff" class="text-xl font-bold text-cyan-300 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 mb-6">
                    你贏了 0 分！
                </div>
                <button id="restart-btn" class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-lg rounded-xl shadow-lg transform active:scale-95 transition-all">
                    🔄 再玩一次
                </button>
            </div>
        </div>

        <div class="text-center text-xs text-slate-500">
            提示：迅速擊中移動標靶獲得高分，測試你的反應速度！
        </div>
    </div>

    <script>
        // --- 遊戲邏輯與狀態 ---
        const GAME_DURATION = 30.0; // 30秒
        // AI 5秒3次 = 平均每 1.666 秒得1分 (5000ms / 3 ≈ 1666.67ms)
        const AI_INTERVAL_MS = 5000 / 3; 

        let playerScore = 0;
        let aiScore = 0;
        let timeLeft = GAME_DURATION;
        let isRunning = false;
        
        let timerInterval = null;
        let aiInterval = null;
        let lastTime = 0;

        // Canvas 繪圖設定
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let gameAreaWidth = 0;
        let gameAreaHeight = 0;

        // 標靶 state
        let target = {
            x: 0,
            y: 0,
            radius: 28,
            vx: 0,
            vy: 0
        };

        // 特效 (粒子)
        let particles = [];

        // UI 元素引用
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const playerBar = document.getElementById('player-bar');
        const aiBar = document.getElementById('ai-bar');
        const playerPercentEl = document.getElementById('player-percent');
        const aiPercentEl = document.getElementById('ai-percent');
        const timerEl = document.getElementById('timer');
        const diffStatusEl = document.getElementById('diff-status');
        
        const startOverlay = document.getElementById('start-overlay');
        const resultModal = document.getElementById('result-modal');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 音效產生器 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playShootSound(pitch = 1) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440 * pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110 * pitch, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 調整 Canvas 尺寸
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            gameAreaWidth = rect.width;
            gameAreaHeight = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 重新隨機移動/生成標靶
        function resetTarget() {
            const padding = 40;
            target.radius = Math.floor(Math.random() * 8) + 24; // 24-32px
            target.x = padding + Math.random() * (gameAreaWidth - padding * 2);
            target.y = padding + Math.random() * (gameAreaHeight - padding * 2);
            // 隨機移動速度
            target.vx = (Math.random() - 0.5) * 3;
            target.vy = (Math.random() - 0.5) * 3;
        }

        // 生成擊中特效粒子
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        // 開始遊戲
        function startGame() {
            playerScore = 0;
            aiScore = 0;
            timeLeft = GAME_DURATION;
            isRunning = true;
            particles = [];

            updateUI();
            startOverlay.classList.add('hidden');
            resultModal.classList.add('hidden');

            resizeCanvas();
            resetTarget();

            // 計時器 (每 100ms 更新一次)
            lastTime = Date.now();
            timerInterval = setInterval(() => {
                const now = Date.now();
                const delta = (now - lastTime) / 1000;
                lastTime = now;
                timeLeft -= delta;

                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
                updateUI();
            }, 50);

            // AI 射擊計時器：每 5 秒射擊 3 次 (平均約 1.67 秒觸發一次)
            aiInterval = setInterval(() => {
                if (isRunning) {
                    aiScore += 1;
                    updateUI();
                }
            }, AI_INTERVAL_MS);

            requestAnimationFrame(gameLoop);
        }

        // 結束遊戲
        function endGame() {
            isRunning = false;
            clearInterval(timerInterval);
            clearInterval(aiInterval);

            // 結算畫面資訊
            const diff = playerScore - aiScore;
            document.getElementById('result-detail').textContent = `玩家 ${playerScore} 分  vs  AI ${aiScore} 分`;

            const resultDiffEl = document.getElementById('result-diff');
            const resultIconEl = document.getElementById('result-icon');
            const resultTitleEl = document.getElementById('result-title');

            if (diff > 0) {
                resultIconEl.textContent = '🏆';
                resultTitleEl.textContent = '獲勝！實力超群！';
                resultTitleEl.className = 'text-3xl font-black text-amber-400 mb-2';
                resultDiffEl.textContent = `你贏了對手 ${diff} 分！`;
                resultDiffEl.className = 'text-xl font-bold text-emerald-400 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 mb-6';
            } else if (diff < 0) {
                resultIconEl.textContent = '🤖';
                resultTitleEl.textContent = '挑戰失敗！';
                resultTitleEl.className = 'text-3xl font-black text-rose-500 mb-2';
                resultDiffEl.textContent = `你輸了 ${Math.abs(diff)} 分，再接再厲！`;
                resultDiffEl.className = 'text-xl font-bold text-rose-400 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 mb-6';
            } else {
                resultIconEl.textContent = '🤝';
                resultTitleEl.textContent = '平手！';
                resultTitleEl.className = 'text-3xl font-black text-blue-400 mb-2';
                resultDiffEl.textContent = `與 AI 旗鼓相當 (平手)！`;
                resultDiffEl.className = 'text-xl font-bold text-blue-300 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 mb-6';
            }

            resultModal.classList.remove('hidden');
        }

        // 更新 UI 得分與進度條
        function updateUI() {
            playerScoreEl.textContent = playerScore;
            aiScoreEl.textContent = aiScore;
            timerEl.textContent = timeLeft.toFixed(1) + 's';

            // 以最高分數 + 10 為條狀基準，或滿分設為動態比較
            const maxScore = Math.max(playerScore, aiScore, 10);
            const pPct = Math.min(100, Math.round((playerScore / maxScore) * 100));
            const aPct = Math.min(100, Math.round((aiScore / maxScore) * 100));

            playerBar.style.width = pPct + '%';
            aiBar.style.width = aPct + '%';

            playerPercentEl.textContent = pPct + '%';
            aiPercentEl.textContent = aPct + '%';

            const diff = playerScore - aiScore;
            if (diff > 0) {
                diffStatusEl.textContent = `目前領先 AI ${diff} 分 🔥`;
                diffStatusEl.className = 'text-center text-xs font-bold pt-1 text-cyan-400';
            } else if (diff < 0) {
                diffStatusEl.textContent = `目前落後 AI ${Math.abs(diff)} 分 ⚠️`;
                diffStatusEl.className = 'text-center text-xs font-bold pt-1 text-rose-400';
            } else {
                diffStatusEl.textContent = '雙方分數平手 ⚔️';
                diffStatusEl.className = 'text-center text-xs font-bold pt-1 text-slate-300';
            }
        }

        // 點擊/射擊檢測
        canvas.addEventListener('pointerdown', (e) => {
            if (!isRunning) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // 計算點擊點與標靶距離
            const dist = Math.hypot(clickX - target.x, clickY - target.y);

            if (dist <= target.radius) {
                // 擊中標靶！
                playerScore += 1;
                playShootSound(1.5);
                createExplosion(target.x, target.y, '#06b6d4'); // 藍綠色爆炸
                resetTarget();
                updateUI();
            } else {
                // 沒擊中發射極小空槍效果
                playShootSound(0.7);
                createExplosion(clickX, clickY, '#64748b');
            }
        });

        // 動畫循環 (繪製 Canvas)
        function gameLoop() {
            ctx.clearRect(0, 0, gameAreaWidth, gameAreaHeight);

            if (isRunning) {
                // 1. 更新並繪製標靶移動
                target.x += target.vx;
                target.y += target.vy;

                // 邊界碰撞反彈
                if (target.x - target.radius < 0 || target.x + target.radius > gameAreaWidth) target.vx *= -1;
                if (target.y - target.radius < 0 || target.y + target.radius > gameAreaHeight) target.vy *= -1;

                // 繪製標靶
                // 外圈
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 中圈
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // 靶心
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = '#06b6d4';
                ctx.fill();

                // 2. 更新並繪製爆炸粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.04;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }

                requestAnimationFrame(gameLoop);
            }
        }

        // 按鈕事件綁定
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
